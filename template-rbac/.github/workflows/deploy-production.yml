name: Deploy to Production

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to deploy (e.g., v1.0.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      backend_image: ${{ steps.images.outputs.BACKEND_IMAGE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.version }}
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Set image names (lowercase)
        id: images
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${REPO}/backend" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.images.outputs.BACKEND_IMAGE }}:latest
            ${{ steps.images.outputs.BACKEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy Backend to DigitalOcean
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production
    # One production deploy at a time: the rollback state files and the
    # container name kalekit_backend_prod are shared by every run.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Runs on the runner, before any SSH step, so a bad secret fails the
      # job while the live backend is still untouched. The "Rollback on
      # failure" step below only runs once this step has passed.
      - name: Check JWT secret
        id: jwt_check
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          if [ "${#JWT_SECRET_KEY}" -lt 32 ]; then
            echo "::error::the JWT_SECRET_KEY environment secret is missing or shorter than 32 characters"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          BACKEND_IMG: ${{ needs.build-and-push.outputs.backend_image }}:${{ needs.build-and-push.outputs.version }}
          CR_PAT: ${{ secrets.CR_PAT }}
          GH_ACTOR: ${{ github.actor }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          DEPLOY_VERSION: ${{ needs.build-and-push.outputs.version }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER || 'kalekit-production' }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: BACKEND_IMG,CR_PAT,GH_ACTOR,DB_USER,DB_PASSWORD,GEMINI_API_KEY,CORS_ORIGINS,API_DOMAIN,DEPLOY_VERSION,DEPLOY_RUN,JWT_SECRET_KEY,JWT_ISSUER
          script: |
            set -e

            # Second guard behind the "Check JWT secret" step: fail before
            # writing any config if the JWT secret is missing or too short
            # (the backend refuses to start with a weak secret). The value is
            # never printed.
            if [ "${#JWT_SECRET_KEY}" -lt 32 ]; then
              echo "ERROR: the JWT_SECRET_KEY environment secret is missing or shorter than 32 characters"
              exit 1
            fi

            # ---- Ensure shared Traefik is running ----
            TRAEFIK_DIR=/home/deploy/opt/kalekit/traefik
            mkdir -p $TRAEFIK_DIR
            docker network create traefik-public 2>/dev/null || true

            cat > $TRAEFIK_DIR/docker-compose.yml <<'TRAEFIKEOF'
            services:
              traefik:
                image: traefik:v3.6
                container_name: kalekit_traefik
                command:
                  - "--api.dashboard=false"
                  - "--providers.docker=true"
                  - "--providers.docker.exposedbydefault=false"
                  - "--providers.docker.network=traefik-public"
                  - "--providers.file.directory=/etc/traefik/dynamic"
                  - "--providers.file.watch=true"
                  - "--entrypoints.web.address=:80"
                  - "--entrypoints.websecure.address=:443"
                  - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
                  - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
                  - "--log.level=WARN"
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - /var/run/docker.sock:/var/run/docker.sock:ro
                  - /etc/letsencrypt:/etc/letsencrypt:ro
                  - ./dynamic:/etc/traefik/dynamic:ro
                networks:
                  - traefik-public
                restart: unless-stopped
                security_opt:
                  - no-new-privileges:true

            networks:
              traefik-public:
                external: true
            TRAEFIKEOF

            # Auto-discover all certbot certificates
            mkdir -p $TRAEFIK_DIR/dynamic
            echo "tls:" > $TRAEFIK_DIR/dynamic/tls.yml
            echo "  certificates:" >> $TRAEFIK_DIR/dynamic/tls.yml
            for cert_dir in /etc/letsencrypt/live/*/; do
              domain=$(basename "$cert_dir")
              [ "$domain" = "README" ] && continue
              if [ -f "${cert_dir}fullchain.pem" ] && [ -f "${cert_dir}privkey.pem" ]; then
                echo "    - certFile: /etc/letsencrypt/live/${domain}/fullchain.pem" >> $TRAEFIK_DIR/dynamic/tls.yml
                echo "      keyFile: /etc/letsencrypt/live/${domain}/privkey.pem" >> $TRAEFIK_DIR/dynamic/tls.yml
              fi
            done

            cd $TRAEFIK_DIR && docker compose up -d

            # ---- Deploy production app ----
            APP_DIR=/home/deploy/opt/kalekit/production
            mkdir -p $APP_DIR && cd $APP_DIR

            # Rollback state, in this directory:
            #   .version.healthy   last version whose health check passed
            #                      (written by the "Health check" step)
            #   .version.switched  "<run>:<version>", written just before the
            #                      backend container is replaced
            # Clear this run's switch marker so a marker left by an earlier
            # deploy can never make the rollback step think we switched.
            rm -f .version.switched

            # Write docker-compose file
            cat > docker-compose.yml <<'COMPOSE'
            services:
              db:
                image: postgres:15-alpine
                container_name: kalekit_db_prod
                environment:
                  POSTGRES_USER: ${DB_USER}
                  POSTGRES_PASSWORD: ${DB_PASSWORD}
                  POSTGRES_DB: kalekit_prod
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - internal
                restart: unless-stopped
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              redis:
                image: redis:7-alpine
                container_name: kalekit_redis_prod
                command: ["redis-server", "--appendonly", "yes"]
                volumes:
                  - redis_data:/data
                networks:
                  - internal
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              backend:
                image: ${BACKEND_IMG}
                container_name: kalekit_backend_prod
                environment:
                  KALEKIT_ENV: production
                  KALEKIT_POSTGRES_USER: ${DB_USER}
                  KALEKIT_POSTGRES_PWD: ${DB_PASSWORD}
                  KALEKIT_POSTGRES_HOST: db
                  KALEKIT_POSTGRES_PORT: 5432
                  KALEKIT_POSTGRES_DATABASE: kalekit_prod
                  KALEKIT_CORS_ORIGINS: ${CORS_ORIGINS}
                  KALEKIT_ALLOWED_HOSTS: ${API_DOMAIN},localhost,127.0.0.1
                  KALEKIT_JWT_SECRET_KEY: ${JWT_SECRET_KEY}
                  KALEKIT_JWT_ISSUER: ${JWT_ISSUER}
                  KALEKIT_REDIS_URL: redis://redis:6379/0
                  KALEKIT_TRUST_PROXY_HEADERS: "true"
                  GEMINI_API_KEY: ${GEMINI_API_KEY}
                expose:
                  - "8000"
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                networks:
                  - internal
                  - traefik-public
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.prod-backend.rule=Host(`${API_DOMAIN}`)"
                  - "traefik.http.routers.prod-backend.entrypoints=websecure"
                  - "traefik.http.routers.prod-backend.tls=true"
                  - "traefik.http.services.prod-backend.loadbalancer.server.port=8000"
                  - "traefik.http.routers.prod-backend.middlewares=prod-backend-headers,prod-backend-ratelimit"
                  - "traefik.http.middlewares.prod-backend-headers.headers.stsSeconds=63072000"
                  - "traefik.http.middlewares.prod-backend-headers.headers.stsIncludeSubdomains=true"
                  - "traefik.http.middlewares.prod-backend-headers.headers.stsPreload=true"
                  - "traefik.http.middlewares.prod-backend-headers.headers.browserXssFilter=true"
                  - "traefik.http.middlewares.prod-backend-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
                  - "traefik.http.middlewares.prod-backend-ratelimit.ratelimit.average=100"
                  - "traefik.http.middlewares.prod-backend-ratelimit.ratelimit.burst=50"
                  - "traefik.http.middlewares.prod-backend-ratelimit.ratelimit.period=1s"
                  - "traefik.http.services.prod-backend.loadbalancer.healthCheck.path=/health"
                  - "traefik.http.services.prod-backend.loadbalancer.healthCheck.interval=5s"
                healthcheck:
                  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
                  interval: 10s
                  timeout: 5s
                  retries: 3
                  start_period: 15s
                restart: unless-stopped

            volumes:
              postgres_data:
              redis_data:

            networks:
              internal:
                driver: bridge
              traefik-public:
                external: true
            COMPOSE

            # Write .env file (owner-readable only; it holds secrets)
            install -m 600 /dev/null .env
            cat > .env <<EOF
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            CORS_ORIGINS=${CORS_ORIGINS}
            API_DOMAIN=${API_DOMAIN}
            JWT_SECRET_KEY=${JWT_SECRET_KEY}
            JWT_ISSUER=${JWT_ISSUER}
            BACKEND_IMG=${BACKEND_IMG}
            EOF

            # Log in to GHCR
            echo "${CR_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            # Pull and deploy
            docker compose pull backend
            docker compose up -d --wait db redis
            # From here on the live backend is replaced: record that first.
            echo "${DEPLOY_RUN}:${DEPLOY_VERSION}" > .version.switched
            docker compose up -d --force-recreate backend

            # Cleanup unused images older than 7 days
            docker image prune -af --filter "until=168h"

            # Show status
            docker compose ps

      - name: Health check
        uses: appleboy/ssh-action@v1.0.0
        env:
          DEPLOY_VERSION: ${{ needs.build-and-push.outputs.version }}
          BACKEND_IMG: ${{ needs.build-and-push.outputs.backend_image }}:${{ needs.build-and-push.outputs.version }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: DEPLOY_VERSION,BACKEND_IMG
          script: |
            # The backend only `expose`s port 8000 (Traefik reaches it over
            # the Docker network) and publishes no host port, so 127.0.0.1:8000
            # on the host does not answer. Request /health from inside the
            # container instead, the same way its compose healthcheck does.
            sleep 10
            for i in 1 2 3 4 5; do
              if docker exec kalekit_backend_prod python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null; then
                echo "Production backend is healthy!"
                # The probe answers for whatever container has this name, so
                # confirm it runs this deploy's image before recording it.
                RUNNING=$(docker inspect -f '{{.Config.Image}}' kalekit_backend_prod)
                if [ "$RUNNING" != "${BACKEND_IMG}" ]; then
                  echo "Health check failed: kalekit_backend_prod runs ${RUNNING}, not ${BACKEND_IMG}"
                  exit 1
                fi
                # Only a version that passed the check becomes a rollback target.
                echo "${DEPLOY_VERSION}" > /home/deploy/opt/kalekit/production/.version.healthy
                echo "Recorded ${DEPLOY_VERSION} as the last healthy version"
                exit 0
              fi
              echo "Attempt $i/5 failed, retrying in 10s..."
              sleep 10
            done
            echo "Health check failed"
            exit 1

      # Skipped when the JWT secret check fails: nothing was changed, so the
      # live backend keeps running as it is. It also does nothing when this
      # run failed before it replaced the backend container (no switch
      # marker for this run). Otherwise it goes back to the last version that
      # passed a health check, not to whatever ran before this deploy.
      - name: Rollback on failure
        if: failure() && steps.jwt_check.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.0
        env:
          BACKEND_IMG_BASE: ${{ needs.build-and-push.outputs.backend_image }}
          CR_PAT: ${{ secrets.CR_PAT }}
          GH_ACTOR: ${{ github.actor }}
          DEPLOY_VERSION: ${{ needs.build-and-push.outputs.version }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: BACKEND_IMG_BASE,CR_PAT,GH_ACTOR,DEPLOY_VERSION,DEPLOY_RUN
          script: |
            cd /home/deploy/opt/kalekit/production || {
              echo "Rollback skipped: no production directory on the host; nothing was changed"
              exit 0
            }

            if [ "$(cat .version.switched 2>/dev/null)" != "${DEPLOY_RUN}:${DEPLOY_VERSION}" ]; then
              echo "Rollback skipped: ${DEPLOY_VERSION} never replaced the running backend; nothing was changed"
              exit 0
            fi

            if [ ! -s .version.healthy ]; then
              echo "Rollback NOT done: no last healthy version is recorded; the failed ${DEPLOY_VERSION} is still running"
              exit 0
            fi
            HEALTHY=$(cat .version.healthy)

            if [ "$HEALTHY" = "${DEPLOY_VERSION}" ]; then
              echo "Rollback NOT done: the last healthy version is ${DEPLOY_VERSION} itself; there is nothing older to go back to"
              exit 0
            fi

            echo "Rolling back from ${DEPLOY_VERSION} to last healthy version ${HEALTHY}..."

            echo "${CR_PAT}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            # docker-compose.yml uses ${BACKEND_IMG}, which comes from .env,
            # so the healthy image tag goes in .env.
            sed -i "s|^BACKEND_IMG=.*|BACKEND_IMG=${BACKEND_IMG_BASE}:${HEALTHY}|" .env
            grep -q "^BACKEND_IMG=${BACKEND_IMG_BASE}:${HEALTHY}\$" .env || {
              echo "ERROR: could not set BACKEND_IMG in .env; rollback not applied"
              exit 1
            }

            docker compose pull backend
            docker compose up -d --force-recreate backend
            rm -f .version.switched
            echo "Rollback to ${HEALTHY} complete"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-backend]
    if: success()
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-push.outputs.version }}
          name: Release ${{ needs.build-and-push.outputs.version }}
          body: |
            ## Deployed to Production

            **Version**: ${{ needs.build-and-push.outputs.version }}
            **Backend**: https://${{ secrets.API_DOMAIN }}
          generate_release_notes: true
